version: "3.9"

services:
  backend:
    build: ./backend
    container_name: timezone-backend
    ports:
      - "8080:8080"
    networks:
      - timezone-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: timezone-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - timezone-net

networks:
  timezone-net:
    driver: bridge
